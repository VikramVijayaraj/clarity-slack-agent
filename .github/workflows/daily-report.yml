name: Daily Clarity Reporter

on:
  schedule:
    # Runs at 3:17 AM UTC (8:47 AM IST) to avoid GitHub's server rush
    - cron: '17 3 * * *'
  workflow_dispatch: # Allows you to run it manually by clicking a button

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Python Agent
        env:
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python agent.py
